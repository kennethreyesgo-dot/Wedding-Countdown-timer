
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternal Bliss Wedding Countdown</title>
    
    <!-- Dependencies -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-script { font-family: 'Great Vibes', cursive; }
        
        /* Custom Animations */
        @keyframes fade-in-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-subtle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
        .animate-fade-in-up { animation: fade-in-up 1.2s ease-out forwards; }
        .animate-pulse-subtle { animation: pulse-subtle 3s infinite ease-in-out; }

        /* Hide scrollbars for the embed */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>

    <!-- React and Libraries Import Map -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19",
    "react-dom": "https://esm.sh/react-dom@19",
    "react-dom/client": "https://esm.sh/react-dom@19/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        import React, { useState, useEffect, useCallback, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { GoogleGenAI } from "@google/genai";

        // --- CONSTANTS & TYPES ---
        const Theme = {
            CLASSIC_WHITE: 'classic-white',
            ROMANTIC_ROSE: 'romantic-rose',
            BOHO_CHIC: 'boho-chic',
            ELEGANT_NAVY: 'elegant-navy',
            GARDEN_GREEN: 'garden-green'
        };

        const THEMES = {
            [Theme.CLASSIC_WHITE]: { bg: 'bg-stone-50', overlay: 'bg-white/40', text: 'text-stone-800', accent: 'text-stone-500', card: 'bg-white/80 backdrop-blur-md', border: 'border-stone-200' },
            [Theme.ROMANTIC_ROSE]: { bg: 'bg-rose-50', overlay: 'bg-rose-100/30', text: 'text-rose-900', accent: 'text-rose-400', card: 'bg-white/70 backdrop-blur-sm', border: 'border-rose-100' },
            [Theme.BOHO_CHIC]: { bg: 'bg-orange-50', overlay: 'bg-orange-100/20', text: 'text-stone-700', accent: 'text-orange-400', card: 'bg-white/60 backdrop-blur-md', border: 'border-orange-100' },
            [Theme.ELEGANT_NAVY]: { bg: 'bg-slate-900', overlay: 'bg-slate-900/50', text: 'text-white', accent: 'text-slate-300', card: 'bg-slate-800/40 backdrop-blur-md', border: 'border-slate-700' },
            [Theme.GARDEN_GREEN]: { bg: 'bg-emerald-50', overlay: 'bg-emerald-100/20', text: 'text-emerald-900', accent: 'text-emerald-500', card: 'bg-white/80 backdrop-blur-md', border: 'border-emerald-100' }
        };

        const DEFAULT_CONFIG = {
            partner1: 'Mai',
            partner2: 'Ken',
            weddingDate: '2026-06-20T14:00:00.000',
            theme: Theme.ROMANTIC_ROSE,
            backgroundImageUrl: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=1920',
            message: 'Our Journey Begins'
        };

        // --- COMPONENTS ---

        const CountdownUnit = ({ value, label, themeStyles }) => (
            <div className={`flex flex-col items-center justify-center p-4 rounded-xl ${themeStyles.card} shadow-lg min-w-[75px] md:min-w-[110px] transition-all hover:scale-105 border ${themeStyles.border}`}>
                <span className={`text-2xl md:text-5xl font-serif font-bold ${themeStyles.text}`}>
                    {value.toString().padStart(2, '0')}
                </span>
                <span className={`text-[10px] md:text-xs uppercase tracking-widest mt-1 ${themeStyles.accent}`}>
                    {label}
                </span>
            </div>
        );

        const SettingsPanel = ({ config, onSave, onClose }) => {
            const [formData, setFormData] = useState(config);
            return (
                <div className="fixed inset-0 z-50 flex justify-end">
                    <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={onClose} />
                    <div className="relative w-full max-w-sm bg-white h-full shadow-2xl p-6 flex flex-col overflow-y-auto">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-serif font-bold">Settings</h2>
                            <button onClick={onClose} className="p-2 hover:bg-stone-100 rounded-full">✕</button>
                        </div>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="block text-[10px] font-bold uppercase text-stone-400 mb-1">Partners</label>
                                <div className="grid grid-cols-2 gap-2">
                                    <input value={formData.partner1} onChange={e => setFormData({...formData, partner1: e.target.value})} className="w-full p-2 border rounded" placeholder="Partner 1" />
                                    <input value={formData.partner2} onChange={e => setFormData({...formData, partner2: e.target.value})} className="w-full p-2 border rounded" placeholder="Partner 2" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-[10px] font-bold uppercase text-stone-400 mb-1">Wedding Date & Time</label>
                                <input type="datetime-local" value={formData.weddingDate.slice(0, 16)} onChange={e => setFormData({...formData, weddingDate: new Date(e.target.value).toISOString()})} className="w-full p-2 border rounded" />
                            </div>
                            <div>
                                <label className="block text-[10px] font-bold uppercase text-stone-400 mb-1">Theme</label>
                                <div className="grid grid-cols-2 gap-2">
                                    {Object.values(Theme).map(t => (
                                        <button key={t} onClick={() => setFormData({...formData, theme: t})} className={`p-2 text-[10px] border rounded ${formData.theme === t ? 'bg-stone-800 text-white' : 'bg-white'}`}>
                                            {t.replace('-', ' ')}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <button onClick={() => { onSave(formData); onClose(); }} className="w-full bg-rose-500 text-white py-3 rounded-lg font-bold mt-4 hover:bg-rose-600">Save Changes</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [config, setConfig] = useState(() => {
                const saved = localStorage.getItem('wedding_config_v2');
                return saved ? JSON.parse(saved) : DEFAULT_CONFIG;
            });

            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0, isPast: false });
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);

            useEffect(() => {
                const timer = setInterval(() => {
                    const target = new Date(config.weddingDate).getTime();
                    const now = new Date().getTime();
                    const diff = target - now;
                    if (diff <= 0) {
                        setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0, isPast: true });
                    } else {
                        setTimeLeft({
                            days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
                            minutes: Math.floor((diff / 1000 / 60) % 60),
                            seconds: Math.floor((diff / 1000) % 60),
                            isPast: false
                        });
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [config.weddingDate]);

            const themeStyles = THEMES[config.theme];

            return (
                <div 
                    className={`min-h-screen relative flex flex-col items-center justify-center p-4 transition-all duration-1000 ${themeStyles.bg}`}
                    style={{ backgroundImage: `url(${config.backgroundImageUrl})`, backgroundSize: 'cover', backgroundPosition: 'center' }}
                >
                    <div className={`absolute inset-0 ${themeStyles.overlay} backdrop-blur-[2px]`} />

                    {/* Settings Trigger */}
                    <button onClick={() => setIsSettingsOpen(true)} className="absolute top-4 right-4 z-40 p-2 bg-white/20 backdrop-blur-md rounded-full text-white hover:scale-110 transition-transform">
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </button>

                    <main className="relative z-10 text-center animate-fade-in-up w-full max-w-2xl">
                        <h1 className={`text-5xl md:text-8xl font-script mb-4 drop-shadow-md ${themeStyles.text}`}>
                            {config.partner1} & {config.partner2}
                        </h1>
                        <p className={`text-xs md:text-lg uppercase tracking-[0.3em] font-light mb-12 ${themeStyles.accent}`}>
                            {new Date(config.weddingDate).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}
                        </p>

                        {!timeLeft.isPast ? (
                            <div className="flex justify-center gap-3 md:gap-4">
                                <CountdownUnit value={timeLeft.days} label="Days" themeStyles={themeStyles} />
                                <CountdownUnit value={timeLeft.hours} label="Hours" themeStyles={themeStyles} />
                                <CountdownUnit value={timeLeft.minutes} label="Mins" themeStyles={themeStyles} />
                                <CountdownUnit value={timeLeft.seconds} label="Secs" themeStyles={themeStyles} />
                            </div>
                        ) : (
                            <div className={`p-8 rounded-2xl ${themeStyles.card} border ${themeStyles.border} shadow-2xl`}>
                                <h2 className={`text-4xl md:text-6xl font-script ${themeStyles.text}`}>Just Married!</h2>
                            </div>
                        )}
                        
                        {config.message && (
                            <p className={`mt-12 text-lg md:text-2xl font-serif italic ${themeStyles.text} opacity-90`}>
                                "{config.message}"
                            </p>
                        )}
                    </main>

                    {isSettingsOpen && <SettingsPanel config={config} onClose={() => setIsSettingsOpen(false)} onSave={(newConfig) => { setConfig(newConfig); localStorage.setItem('wedding_config_v2', JSON.stringify(newConfig)); }} />}
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
