
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Countdown</title>
    
    <!-- 1. Standard Scripts (No ESM/MIME issues) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: #fcfaf8; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-script { font-family: 'Great Vibes', cursive; }
        
        @keyframes fade-in-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fade-in-up 1s ease-out forwards; }
        
        #root:empty::after {
            content: "Loading Timer...";
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Playfair Display', serif; color: #a8a29e;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <!-- 3. The App Code (Transpiled by Babel in the browser) -->
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const Theme = {
            ROMANTIC: 'romantic',
            CLASSIC: 'classic',
            NAVY: 'navy'
        };

        const THEMES = {
            romantic: { bg: 'bg-rose-50', overlay: 'bg-rose-100/30', text: 'text-rose-900', accent: 'text-rose-400', card: 'bg-white/80' },
            classic: { bg: 'bg-stone-100', overlay: 'bg-white/40', text: 'text-stone-800', accent: 'text-stone-500', card: 'bg-white/90' },
            navy: { bg: 'bg-slate-900', overlay: 'bg-slate-900/50', text: 'text-white', accent: 'text-slate-300', card: 'bg-slate-800/60' }
        };

        const CountdownUnit = ({ value, label, styles }) => (
            <div className={`flex flex-col items-center justify-center p-3 md:p-5 rounded-2xl shadow-sm min-w-[70px] md:min-w-[100px] border border-white/20 backdrop-blur-md ${styles.card}`}>
                <span className={`text-2xl md:text-4xl font-serif font-bold ${styles.text}`}>
                    {value.toString().padStart(2, '0')}
                </span>
                <span className={`text-[10px] md:text-xs uppercase tracking-widest mt-1 ${styles.accent}`}>
                    {label}
                </span>
            </div>
        );

        const App = () => {
            const [config, setConfig] = useState(() => {
                const saved = localStorage.getItem('wedding_v3');
                return saved ? JSON.parse(saved) : {
                    p1: 'Partner 1',
                    p2: 'Partner 2',
                    date: '2026-06-20T14:00',
                    theme: 'romantic'
                };
            });

            const [timeLeft, setTimeLeft] = useState({ d: 0, h: 0, m: 0, s: 0 });
            const [showSettings, setShowSettings] = useState(false);

            useEffect(() => {
                const update = () => {
                    const diff = new Date(config.date) - new Date();
                    if (diff <= 0) return setTimeLeft({ d: 0, h: 0, m: 0, s: 0 });
                    setTimeLeft({
                        d: Math.floor(diff / 86400000),
                        h: Math.floor((diff / 3600000) % 24),
                        m: Math.floor((diff / 60000) % 60),
                        s: Math.floor((diff / 1000) % 60)
                    });
                };
                const timer = setInterval(update, 1000);
                update();
                return () => clearInterval(timer);
            }, [config.date]);

            const styles = THEMES[config.theme] || THEMES.romantic;

            return (
                <div className={`min-h-screen relative flex flex-col items-center justify-center p-6 ${styles.bg} transition-colors duration-700`}>
                    <div className={`absolute inset-0 ${styles.overlay}`} />
                    
                    <main className="relative z-10 text-center animate-fade-in-up">
                        <h1 className={`text-5xl md:text-7xl font-script mb-4 ${styles.text}`}>
                            {config.p1} & {config.p2}
                        </h1>
                        <p className={`text-xs md:text-sm uppercase tracking-[0.3em] mb-10 ${styles.accent}`}>
                            {new Date(config.date).toLocaleDateString(undefined, { dateStyle: 'long' })}
                        </p>

                        <div className="flex gap-2 md:gap-4 justify-center">
                            <CountdownUnit value={timeLeft.d} label="Days" styles={styles} />
                            <CountdownUnit value={timeLeft.h} label="Hours" styles={styles} />
                            <CountdownUnit value={timeLeft.m} label="Mins" styles={styles} />
                            <CountdownUnit value={timeLeft.s} label="Secs" styles={styles} />
                        </div>

                        <button 
                            onClick={() => setShowSettings(true)}
                            className="mt-12 px-6 py-2 rounded-full border border-current text-[10px] uppercase tracking-widest opacity-30 hover:opacity-100 transition-opacity"
                            style={{ color: 'inherit' }}
                        >
                            Customize Timer
                        </button>
                    </main>

                    {showSettings && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setShowSettings(false)} />
                            <div className="relative bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm">
                                <h2 className="text-xl font-serif font-bold mb-6">Setup Your Countdown</h2>
                                <div className="space-y-4">
                                    <input className="w-full p-3 border rounded-xl" placeholder="Partner 1" value={config.p1} onChange={e => setConfig({...config, p1: e.target.value})} />
                                    <input className="w-full p-3 border rounded-xl" placeholder="Partner 2" value={config.p2} onChange={e => setConfig({...config, p2: e.target.value})} />
                                    <input type="datetime-local" className="w-full p-3 border rounded-xl" value={config.date} onChange={e => setConfig({...config, date: e.target.value})} />
                                    <div className="flex gap-2">
                                        {Object.keys(THEMES).map(t => (
                                            <button key={t} onClick={() => setConfig({...config, theme: t})} className={`flex-1 py-2 text-[10px] uppercase rounded-lg border ${config.theme === t ? 'bg-stone-800 text-white' : 'bg-white text-stone-400'}`}>{t}</button>
                                        ))}
                                    </div>
                                    <button onClick={() => { localStorage.setItem('wedding_v3', JSON.stringify(config)); setShowSettings(false); }} className="w-full bg-rose-500 text-white py-4 rounded-xl font-bold">Save & Apply</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
